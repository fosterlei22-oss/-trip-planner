server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：前端路由落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API + SSE
    # 注意 proxy_pass 不带尾部斜杠，请求 URI 原样透传（/api/trip/plan/stream 保持完整路径）
    # Host 用 $http_host（保留端口）：MCP 的 307 重定向靠 Host 头构造 Location，
    # 若用 $host 会丢掉端口，重定向到错误的 localhost:80
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 需要关闭缓冲，否则事件会被 nginx 攒住不实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP streamable-http（POST JSON-RPC，可能是流式响应，同样关闭缓冲）
    location /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

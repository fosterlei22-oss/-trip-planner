services:
  redis:
    image: redis:7-alpine
    container_name: helloagents-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: helloagents-backend
    env_file:
      # 真实 API key 只在此处运行时注入，绝不打进镜像
      - ./backend/.env
    environment:
      # 显式覆盖：compose 网络内用服务名解析 redis（.env 里可能是 localhost，必须覆盖）
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      # 等 redis 健康后再启动后端；redis 挂了后端仍能靠内存回退兜底运行
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim 没有 curl，用 urllib 打健康检查（fast、不依赖 LLM）
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: helloagents-frontend
    # nginx 模板变量：指向 compose 网络内的 backend 服务（裸 host:port，nginx 模板补 http://）
    environment:
      BACKEND_URL: backend:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
